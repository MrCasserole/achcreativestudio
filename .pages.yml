media:
  input: portfolio
  output: /portfolio
  rename: safe
  extensions: [jpg, jpeg, png, webp]
  categories: [image]

content:
  - name: projects
    label: Projekty
    type: file
    path: content/projects.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: title, label: Nazwa projektu, type: string, required: true }
      - name: slug
        label: Adres projektu
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9-]+$"
          message: "Używaj tylko małych liter, cyfr i myślników, np. nowy-projekt"
        description: "Bez spacji i polskich znaków, np. irish-summertime."
      - name: type
        label: Zakres prac
        type: string
        required: true
        description: "Np. Fotografia · Content · Creative direction"
      - { name: intro, label: Opis projektu, type: text, required: true }
      - name: cover
        label: Okładka
        type: image
        required: true
        options: { path: portfolio, extensions: [jpg, jpeg, png, webp], rename: safe }
      - name: images
        label: Zdjęcia w galerii
        type: image
        required: true
        options:
          path: portfolio
          multiple: { min: 1, max: 30 }
          unique: true
          extensions: [jpg, jpeg, png, webp]
          rename: safe
      - name: order
        label: Kolejność
        type: number
        required: true
        description: "1 pojawi się jako pierwszy projekt."
      - { name: published, label: Widoczny na stronie, type: boolean, required: true }

settings:
  commit:
    identity: user

