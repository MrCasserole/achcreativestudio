<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt — ACH Creative Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="nav">
  <a href="index.html" class="logo">ACH</a>

  <button class="hamburger" id="hamburger" aria-label="Otwórz menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="nav-menu">
    <a href="projects.html">Projekty</a>
    <a href="index.html#about">O mnie</a>
    <a href="index.html#services">Usługi</a>
    <a href="contact.html">Kontakt</a>
  </nav>
</header>

<main class="contact-page reveal">
  <section class="contact-hero">
    <div>
      <h1>Porozmawiajmy<br>o projekcie</h1>
      <p>Masz markę, lokal, produkt albo pomysł? Napisz — zobaczymy, co można z tego wycisnąć wizualnie.</p>
    </div>

    <form class="contact-form">
      <label>
        Imię
        <input type="text" placeholder="Twoje imię">
      </label>

      <label>
        E-mail
        <input type="email" placeholder="kontakt@email.pl">
      </label>

      <label>
        Temat
        <input type="text" placeholder="Branding / menu / social media...">
      </label>

      <label>
        Wiadomość
        <textarea placeholder="Napisz kilka zdań o projekcie"></textarea>
      </label>

      <button type="submit">Wyślij wiadomość →</button>
    </form>
  </section>
</main>

<footer id="contact">
  <span>ACH © 2026</span>
  <a href="mailto:kontakt@achstudio.pl">kontakt@achstudio.pl</a>
</footer>

<script src="script.js"></script>
</body>
</html>
