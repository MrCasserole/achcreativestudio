<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt — ACH Creative Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="nav">
  <a href="index.html" class="logo">ACH</a>

  <button class="hamburger" id="hamburger" aria-label="Otwórz menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <nav id="nav-menu">
    <a href="projects.html">Projekty</a>
    <a href="index.html#about">O mnie</a>
    <a href="index.html#services">Usługi</a>
    <a href="contact.html">Kontakt</a>
  </nav>
</header>

<main class="contact-page reveal">
  <section class="contact-hero">
    <div>
      <h1>Porozmawiajmy<br>o projekcie</h1>
      <p>Masz markę, lokal, produkt albo pomysł? Napisz — zobaczymy, co można z tego wycisnąć wizualnie.</p>
    </div>

    <form class="contact-form" action="https://api.web3forms.com/submit" method="POST">

      <!-- TWÓJ KLUCZ -->
      <input type="hidden" name="access_key" value="9e2ba512-eb10-4288-80d6-fecd91f6ddf1">
    
      <!-- IMIĘ -->
      <label>
        Imię
        <input type="text" name="name" placeholder="Twoje imię" required>
      </label>
    
      <!-- EMAIL -->
      <label>
        E-mail
        <input type="email" name="email" placeholder="kontakt@email.pl" required>
      </label>
    
      <!-- TEMAT -->
      <label>
        Temat
        <input type="text" name="subject" placeholder="Branding / menu / social media..." required>
      </label>
    
      <!-- WIADOMOŚĆ -->
      <label>
        Wiadomość
        <textarea name="message" required></textarea>
      </label>
    
      <!-- BUTTON -->
      <button type="submit">Wyślij</button>
    
    </form>
  </section>
</main>

<footer id="contact">
  <span>ACH © 2026</span>
  <a href="mailto:kontakt@achstudio.pl">kontakt@achstudio.pl</a>
</footer>

<script src="script.js"></script>
</body>
</html>
