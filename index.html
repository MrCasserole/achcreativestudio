<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACH! Creative Studio</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="frame">
        <div class="logo">
          <img src="./assets/logo.svg" alt="ACH! Creative Studio" />
        </div>

        <p class="tagline">Projektuje z myślą o ludziach.</p>

        <p class="services">Branding · Print · Digital · Social Media</p>

        <a
          class="instagram"
          href="https://www.instagram.com/achcreativestudio/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram ACH Creative Studio"
        >
          <svg class="instagram-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" ry="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="1.2"></circle>
          </svg>
        </a>

        <p class="location">Rzeszów, Polska</p>
      </div>
    </section>
  </main>
</body>
</html>
